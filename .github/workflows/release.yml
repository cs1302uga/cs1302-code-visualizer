name: CI / Release

on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }}, jdk${{ matrix.java-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.13', '3.14']
        java-version: ['21', '25']

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cs1302_code_visualizer/frontend/package-lock.json
      - name: Install dependencies
        run: |
          uv sync --all-extras --dev --python ${{ matrix.python-version }}
          npm --prefix cs1302_code_visualizer/frontend ci
      - name: Run Frontend Tests & Build
        run: |
          npm --prefix cs1302_code_visualizer/frontend test -- --run
          npm --prefix cs1302_code_visualizer/frontend run build
      - name: Run Linters & Type Checks
        run: |
          uv run ruff check cs1302_code_visualizer tests scripts
          uv run basedpyright --level error cs1302_code_visualizer
      - name: Run Python Tests
        run: uv run pytest -v
      - name: Build Python Distribution
        run: uv build
      - name: Upload Frontend Build Artifact
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && matrix.java-version == '21'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: cs1302_code_visualizer/frontend/build/
      - name: Upload Python Dist Artifact
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && matrix.java-version == '25'
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download Frontend Build
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: cs1302_code_visualizer/frontend/build
      - name: Download Python Dist
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            cs1302_code_visualizer/frontend/build/*
            dist/*
