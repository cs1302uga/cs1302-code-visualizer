[project]
name = "cs1302-code-visualizer"
version = "0.14.0"
description = "Visualize Java program memory state and output a screenshot."
authors = [
    {name = "Gabe Livengood", email = "timothy.livengood@uga.edu"},
    {name = "Michael E. Cotterell", email = "mepcott@uga.edu"},
]
maintainers = [
    {name = "Michael E. Cotterell", email = "mepcott@uga.edu"},
    {name = "Bradley J. Barnes", email = "bjb211@uga.edu"},
]
license = "MIT"
license-files = [
    "LICEN[CS]E*",
    "cs1302_code_visualizer/frontend/LICENSE",
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.7.22",
    "click>=8.0.0",
    "packaging>=24.0",
    "pillow>=11.2.1",
    "platformdirs>=4.3.8",
    "requests>=2.32.4",
    "rich>=14.3.3",
    "selenium>=4.33.0",
    "typer>=0.12.0",
]

[tool.cs1302-code-visualizer]
tracer-url  = "https://github.com/cs1302uga/cs1302-tracer/releases/download/v3.1.2/code-tracer.jar"
tracer-sha256 = "02fd7a05bba1448155865264dba7be6852f1caff9f44aeb6b4a2796e7e13a132"

[tool.cs1302book.system-dependencies]
system-dependencies = [
    "enchant>=2.8.0,<3",
    "graphviz>=15.1.0",
    "plantuml>=1.2026.1,<1.2027",
    "jdk>=25,<26",
    "uv>=0.11.0",
]

[project.scripts]
code-visualizer = "cs1302_code_visualizer.cli:main"
generate_trace = "cs1302_code_visualizer.trace_generator:main"
generate_visualization = "cs1302_code_visualizer.browser_driver:main"
install-deps = "scripts.install_deps:main"
install-enchant = "scripts.installer.enchant:main"
install-graphviz = "scripts.installer.graphviz:main"
install-jdk = "scripts.installer.jdk:main"
install-plantuml = "scripts.installer.plantuml:main"
install-uv = "scripts.installer.uv:main"
list_breakpoints = "cs1302_code_visualizer.breakpoint_lister:main"
render_html = "cs1302_code_visualizer:render_html_cli"
render_image = "cs1302_code_visualizer:main"

[project.optional-dependencies]
gallery = [
    "pygments>=2.21.0",
]

[tool.basedpyright]
typeCheckingMode = "standard"
reportAny = false
reportExplicitAny = false
reportImportCycles = false

[tool.ruff]
line-length = 100
indent-width = 4
preview = true
show-fixes = true

[tool.ruff.analyze]
type-checking-imports = true

[tool.ruff.format]
indent-style = "space"
preview = true
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
extend-select = ["D", "F401", "I", "TID", "Q"]
future-annotations = true
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"scripts/*" = ["D"]


[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cs1302_code_visualizer --cov-report=term-missing --cov-fail-under=100"
filterwarnings = [
    "ignore:.*found in sys.modules after import of package.*:RuntimeWarning",
]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.0",
    "deptry>=0.25.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
]

[tool.hatch.build.targets.wheel]
packages = ["cs1302_code_visualizer"]
exclude = [
    "cs1302_code_visualizer/frontend/node_modules",
    "cs1302_code_visualizer/frontend/tests",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "cs1302_code_visualizer/frontend/node_modules",
    "cs1302_code_visualizer/frontend/tests",
]

[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "cs1302_code_visualizer/_tracer.toml"
